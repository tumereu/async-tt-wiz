* { box-sizing: border-box; margin: 0px; padding: 0px; }
body { font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background-color: var(--bg-page); color: var(--text-main); width: 100%; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; font-size: 15px; line-height: 1.4; -webkit-font-smoothing: antialiased; }

.status-icons .material-symbols-outlined { font-size: 16px; color: var(--text-muted); }

.icon-button:hover { background-color: var(--bg-page); }
.top-title { font-size: 22px; font-weight: 600; color: var(--text-main); letter-spacing: -0.01em; }
.top-bar-right { display: flex; align-items: center; }
.btn-text-primary { min-height: 48px; padding: 0px 16px; background: transparent; color: var(--teal-primary); font-size: 15px; font-weight: 600; border: 1px solid transparent; border-radius: var(--radius); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
.btn-text-primary:hover { background-color: var(--teal-subtle); }
.btn-contained-teal { min-height: 48px; padding: 0px 20px; background-color: var(--teal-primary); color: rgb(255, 255, 255); font-size: 15px; font-weight: 500; border-width: medium; border-style: none; border-color: currentcolor; border-image: none; border-radius: var(--radius); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.btn-contained-teal:hover { background-color: var(--teal-hover); }
.btn-text { min-height: 48px; padding: 0px 14px; background: transparent; border: 1px solid var(--border); color: var(--text-main); font-size: 14px; font-weight: 500; border-radius: var(--radius); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.btn-text:hover { background-color: var(--bg-page); }
.btn-text-danger { min-height: 48px; padding: 0px 14px; background: transparent; border: 1px solid var(--border); color: var(--danger); font-size: 14px; font-weight: 500; border-radius: var(--radius); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.btn-text-danger:hover { background-color: rgb(254, 226, 226); }
.app-content { flex: 1 1 0%; width: 100%; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 20px; }
.content-column { display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 640px; margin: 0px auto; }
.section-card { background-color: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.section-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-subtle); padding-bottom: 8px; }
.section-title { font-size: 15px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
.section-count { font-size: 13px; font-weight: 500; color: var(--text-helper); }
.list-group { display: flex; flex-direction: column; gap: 12px; }
