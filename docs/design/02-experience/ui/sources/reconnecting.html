.game-shell { flex: 1 1 0%; width: 100%; height: 100%; position: relative; background-color: rgb(241, 245, 249); display: flex; flex-direction: column; overflow: hidden; }
.gameplay-placeholder { flex: 1 1 0%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px; gap: 12px; background-color: rgb(241, 245, 249); border: 2px dashed rgb(203, 213, 225); margin: 16px; border-radius: 8px; }
.gameplay-placeholder-label { font-size: 15px; color: rgb(100, 116, 139); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }

.read-only-banner .material-symbols-outlined { font-size: 16px; }

.status-icon-wrapper .material-symbols-outlined { font-size: 24px; animation: 2s ease-in-out 0s infinite normal none running pulse; }
@keyframes pulse {

  50% { opacity: 0.6; transform: scale(0.96); }

            <span class="modal-subtitle">Connection lost</span>
          </div>
        </header>

        <div class="modal-body">
          <p>Game actions are unavailable while disconnected.</p>
          <p class="helper-text">Previously sent actions will recover automatically.</p>
        </div>

        <footer class="modal-actions">
          <button class="btn btn-primary" type="button">Review downloaded data</button>
          <button class="btn btn-secondary" type="button">Back to games</button>
        </footer>
      </section>
    </div>
  </main>

  <footer class="bottom-safe-inset" aria-hidden="true">
