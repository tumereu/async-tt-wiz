*, ::before, ::after { box-sizing: border-box; margin: 0px; padding: 0px; }
:root { --bg: #f8fafc; --surface: #ffffff; --border: #cbd5e1; --border-subtle: #e2e8f0; --text: #0f172a; --text-muted: #64748b; --primary: #0d9488; --primary-hover: #0f766e; --info-bg: #f1f5f9; --info-border: #cbd5e1; --info-text: #334155; --radius: 8px; }
html, body { width: 100%; height: 100dvh; overflow: hidden; background-color: var(--bg); font-family: Roboto, system-ui, -apple-system, sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; }
.app-shell { display: flex; flex-direction: column; width: 100%; height: 100dvh; max-height: 100dvh; background-color: var(--bg); }

.status-bar-icons { display: flex; align-items: center; gap: 6px; }
.status-bar-icons .material-symbols-outlined { font-size: 15px; line-height: 1; }
.top-bar { height: 56px; min-height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0px 8px 0px 4px; border-bottom: 1px solid var(--border); background-color: var(--surface); }
.top-bar-left { display: flex; align-items: center; gap: 4px; }
.nav-btn { width: 48px; height: 48px; display: inline-flex; align-items: center; justify-content: center; border-width: medium; border-style: none; border-color: currentcolor; border-image: none; background: transparent; border-radius: var(--radius); color: var(--text); cursor: pointer; text-decoration: none; }
.nav-btn:focus-visible { outline: 2px solid var(--primary); }
.app-title-group { display: flex; align-items: baseline; gap: 8px; }
.app-title { font-size: 16px; font-weight: 700; letter-spacing: -0.2px; color: var(--text); }
.badge-draft { font-size: 12px; font-weight: 500; color: var(--text-muted); border: 1px solid var(--border); padding: 2px 6px; border-radius: 4px; background: var(--bg); }
.content-area { flex: 1 1 0%; width: 100%; overflow: hidden auto; display: flex; flex-direction: column; align-items: center; padding: 16px; }
.flow-container { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 16px; margin: auto 0px; }
.context-panel { display: flex; flex-direction: column; gap: 8px; }
.page-title { font-size: 24px; font-weight: 700; color: var(--text); line-height: 1.25; }
.page-desc { font-size: 14px; color: var(--text-muted); line-height: 1.45; }
.form-card { background-color: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 16px; display: flex; flex-direction: column; gap: 14px; }
.field-group { display: flex; flex-direction: column; gap: 6px; }
.field-label { font-size: 14px; font-weight: 500; color: var(--text); }
.input-control { width: 100%; height: 48px; min-height: 48px; padding: 0px 12px; font-size: 15px; color: var(--text); background-color: rgb(255, 255, 255); border: 1px solid var(--border); border-radius: var(--radius); outline: none; font-family: inherit; }
.input-control:focus { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
.btn-primary { width: 100%; height: 48px; min-height: 48px; background-color: var(--primary); color: rgb(255, 255, 255); border: 1px solid transparent; border-radius: var(--radius); font-size: 15px; font-weight: 500; font-family: inherit; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
.btn-primary:hover { background-color: var(--primary-hover); }
.status-banner { background-color: var(--info-bg); border: 1px solid var(--info-border); border-radius: var(--radius); padding: 12px; display: flex; align-items: flex-start; gap: 10px; }
.status-banner .material-symbols-outlined { font-size: 20px; color: var(--primary); line-height: 1.2; flex-shrink: 0; }
.status-banner-text { font-size: 13.5px; line-height: 1.4; color: var(--info-text); font-weight: 500; }
.session-notice { font-size: 13px; line-height: 1.45; color: var(--text-muted); border-top: 1px solid var(--border-subtle); padding-top: 10px; margin-top: 2px; }
.actions-footer { display: flex; flex-direction: column; align-items: center; justify-content: center; padding-top: 4px; }
.btn-secondary-text { min-height: 48px; padding: 0px 16px; display: inline-flex; align-items: center; justify-content: center; background: transparent; border-width: medium; border-style: none; border-color: currentcolor; border-image: none; color: var(--primary); font-size: 15px; font-weight: 500; text-decoration: underline; cursor: pointer; font-family: inherit; }
.btn-secondary-text:hover { color: var(--primary-hover); }
.bottom-safe-area { height: 16px; min-height: 16px; display: flex; align-items: center; justify-content: center; background-color: var(--bg); flex-shrink: 0; }
.home-indicator { width: 72px; height: 4px; background-color: rgb(203, 213, 225); border-radius: 2px; }
@media (min-width: 700px) and (max-height: 500px) {
  .top-bar { height: 48px; min-height: 48px; }
