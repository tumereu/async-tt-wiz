<!doctype html>
<meta charset=utf-8>
<title>Screenshot review</title>
<!-- Opened by scripts/review.sh screenshots, which writes data.js (window.SHOTS) next to a copy of this page. -->
<style>
  html, body { margin: 0; height: 100%; background: #1e1e1e; color: #eee; font-family: sans-serif; }
  body { display: flex; flex-direction: column; }
  header { padding: 10px 16px; display: flex; gap: 16px; align-items: baseline; border-bottom: 1px solid #444; }
  #count { font-weight: bold; white-space: nowrap; }
  #hidden { color: #aaa; white-space: nowrap; }
  #name { color: #aaa; font-family: monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #caption { padding: 10px 16px 4px; font-size: 18px; }
  #oldcaption { padding: 0 16px 4px; color: #aaa; font-size: 14px; }
  #commits { padding: 0 16px 8px; color: #8ab; font-size: 13px; font-family: monospace; white-space: pre-line; }
  main { flex: 1; min-height: 0; display: flex; gap: 12px; padding: 0 16px; }
  figure { flex: 1; min-width: 0; margin: 0; display: flex; flex-direction: column; }
  figcaption { color: #aaa; font-size: 13px; padding: 4px 0; }
  .frame { flex: 1; min-height: 0; display: flex; align-items: flex-start; justify-content: center; }
  .pic { position: relative; overflow: hidden; border: 1px solid #555; flex: none; }
  .pic img { position: absolute; max-width: none; }
  .pic.zoomed img { image-rendering: pixelated; }
  .box { position: absolute; border: 2px solid #ff3b3b; box-shadow: 0 0 0 1px #000; pointer-events: none; }
  .box.seen { border: 2px dashed #e0c040; }
  main.nobox .box { display: none; }
  .missing { color: #888; font-style: italic; padding: 40px; }
  main.flip #beforeFig { display: none; }
  footer { padding: 8px 16px; display: flex; gap: 12px; align-items: center; border-top: 1px solid #444; }
  textarea { flex: 1; background: #2a2a2a; color: #eee; border: 1px solid #555; font: inherit; height: 2.6em; }
  button { background: #333; color: #eee; border: 1px solid #666; padding: 6px 12px; cursor: pointer; }
  button.on { background: #456; }
  .keys { color: #888; font-size: 13px; }
  .red { color: #ff6b6b; } .yellow { color: #e0c040; }
  #done { display: none; padding: 40px; font-size: 18px; }
  #done pre { background: #2a2a2a; padding: 12px; white-space: pre-wrap; }
</style>
<header><span id=count></span><span id=hidden></span><span id=name></span></header>
<div id=caption></div>
<div id=oldcaption></div>
<div id=commits></div>
<main id=view>
  <figure id=beforeFig><figcaption>Approved</figcaption><div class=frame id=before></div></figure>
  <figure id=afterFig><figcaption id=afterLabel>Now</figcaption><div class=frame id=after></div></figure>
</main>
<div id=done></div>
<footer>
  <button id=prev>← Prev</button><button id=next>Next →</button><button id=flip>Flip (Space)</button>
  <button id=zoom>Zoom (Z)</button><button id=boxes>Boxes (B)</button><button id=all>Repeats (A)</button>
  <textarea id=note placeholder="Note on this screenshot (N to focus, Esc to leave)"></textarea>
  <button id=summary>Notes</button>
  <span class=keys><span class=red>▭</span> changed · <span class=yellow>▭</span> same change as an earlier screenshot</span>
</footer>
<script src="data.js"></script>
<script>
const all = window.SHOTS, $ = id => document.getElementById(id);
const store = 'shot-review-notes:' + window.SHOTS_KEY;
const notes = JSON.parse(localStorage.getItem(store) || '{}');
const PAD = 24, MAX_ZOOM = 8;
let shots = [], i = 0, flipped = false, zoom = false, showRepeats = false, showBoxes = true;

function filter(keep) {
  shots = showRepeats ? all : all.filter(s => !s.repeat);
  if (!shots.length) shots = all;
  const at = keep ? shots.indexOf(keep) : -1;
  i = at >= 0 ? at : Math.max(0, Math.min(i, shots.length - 1));
}
// The part of the image to show: all of it, or with Zoom the changed areas (new ones first) and a margin.
function viewRect(s) {
  const [w, h] = s.size;
  const fresh = s.regions.filter(r => !r.seen), rs = fresh.length ? fresh : s.regions;
  if (!zoom || !rs.length) return [0, 0, w, h];
  let x0 = Math.min(...rs.map(r => r.box[0])), y0 = Math.min(...rs.map(r => r.box[1]));
  let x1 = Math.max(...rs.map(r => r.box[0] + r.box[2])), y1 = Math.max(...rs.map(r => r.box[1] + r.box[3]));
  x0 = Math.max(0, x0 - PAD); y0 = Math.max(0, y0 - PAD); x1 = Math.min(w, x1 + PAD); y1 = Math.min(h, y1 + PAD);
  return [x0, y0, x1 - x0, y1 - y0];
}
function picture(frame, src, s) {
  frame.innerHTML = '';
  const [vx, vy, vw, vh] = viewRect(s);
  const scale = Math.min(frame.clientWidth / vw, frame.clientHeight / vh, zoom ? MAX_ZOOM : 1e9);
  const pic = document.createElement('div');
  pic.className = 'pic' + (zoom && scale > 1.5 ? ' zoomed' : '');
  pic.style.width = vw * scale + 'px'; pic.style.height = vh * scale + 'px';
  const im = new Image(); im.src = src;
  Object.assign(im.style, { width: s.size[0] * scale + 'px', height: s.size[1] * scale + 'px', left: -vx * scale + 'px', top: -vy * scale + 'px' });
  pic.appendChild(im);
  for (const r of s.regions) {
    const [x, y, w, h] = r.box, b = document.createElement('div');
    b.className = 'box' + (r.seen ? ' seen' : '');
    Object.assign(b.style, { left: (x - vx) * scale - 4 + 'px', top: (y - vy) * scale - 4 + 'px', width: w * scale + 4 + 'px', height: h * scale + 4 + 'px' });
    pic.appendChild(b);
  }
  frame.appendChild(pic);
}
function show() {
  $('done').style.display = 'none'; $('view').style.display = '';
  const s = shots[i], hidden = all.filter(x => x.repeat).length;
  $('count').textContent = `${i + 1} / ${shots.length}` + (s.status === 'A' ? ' · new' : s.status === 'D' ? ' · removed' : s.repeat ? ' · repeat' : '');
  $('hidden').textContent = hidden ? (showRepeats ? `incl. ${hidden} repeats (A hides them)` : `+ ${hidden} that only repeat changes shown here (A shows them)`) : '';
  $('name').textContent = s.name;
  $('caption').textContent = s.caption || s.oldCaption || '(no caption)';
  $('oldcaption').textContent = s.oldCaption && s.caption && s.oldCaption !== s.caption ? 'Was: ' + s.oldCaption : '';
  $('commits').textContent = s.commits.length ? 'Changed by: ' + s.commits.join('\n            ') : '';
  $('view').classList.toggle('flip', flipped);
  $('view').classList.toggle('nobox', !showBoxes);
  $('zoom').classList.toggle('on', zoom); $('boxes').classList.toggle('on', showBoxes); $('all').classList.toggle('on', showRepeats);
  if (s.before) picture($('before'), s.before, s);
  else $('before').innerHTML = '<div class=missing>No approved image: this screenshot is new.</div>';
  const afterSrc = flipped && s.before ? s.before : s.after;
  if (afterSrc) picture($('after'), afterSrc, s);
  else $('after').innerHTML = '<div class=missing>Removed: no test makes this screenshot any more.</div>';
  $('afterLabel').textContent = flipped ? (s.before ? 'Approved (Space to flip back)' : 'Now (no approved image)') : 'Now';
  $('note').value = notes[s.name] || '';
}
function go(d) { flipped = false; i = Math.max(0, Math.min(shots.length - 1, i + d)); show(); }
function summary() {
  const lines = all.filter(s => notes[s.name]).map(s => `${s.name}: ${notes[s.name]}`);
  $('view').style.display = 'none'; $('done').style.display = 'block';
  $('done').innerHTML = lines.length
    ? `<p>${lines.length} note(s). Copy and paste them to Claude:</p><pre>${lines.join('\n').replace(/</g, '&lt;')}</pre><p>Esc or ←/→ to go back.</p>`
    : '<p>No notes. If everything looked right, approve with <code>scripts/review.sh approve screenshots</code>.</p><p>Esc or ←/→ to go back.</p>';
}
const toggle = f => () => { const keep = shots[i]; f(); filter(keep); show(); };
const flip = toggle(() => flipped = !flipped), zoomIt = toggle(() => zoom = !zoom);
const boxIt = toggle(() => showBoxes = !showBoxes), repeatIt = toggle(() => showRepeats = !showRepeats);
$('prev').onclick = () => go(-1); $('next').onclick = () => go(1);
$('flip').onclick = flip; $('zoom').onclick = zoomIt; $('boxes').onclick = boxIt; $('all').onclick = repeatIt;
$('summary').onclick = summary;
$('note').oninput = e => {
  const v = e.target.value.trim(); if (v) notes[shots[i].name] = v; else delete notes[shots[i].name];
  localStorage.setItem(store, JSON.stringify(notes));
};
window.onresize = () => { if ($('done').style.display !== 'block' && shots.length) show(); };
document.addEventListener('keydown', e => {
  if (e.target === $('note')) { if (e.key === 'Escape') $('note').blur(); return; }
  if (e.key === 'ArrowRight') { if (i === shots.length - 1 && $('done').style.display !== 'block') summary(); else go(1); }
  else if (e.key === 'ArrowLeft') go(-1);
  else if (e.key === 'Escape') show();
  else if (e.key === ' ') { e.preventDefault(); flip(); }
  else if (e.key === 'z' || e.key === 'Z') zoomIt();
  else if (e.key === 'b' || e.key === 'B') boxIt();
  else if (e.key === 'a' || e.key === 'A') repeatIt();
  else if (e.key === 'n' || e.key === 'N') { e.preventDefault(); $('note').focus(); }
});
filter();
if (shots.length) show(); else { $('view').style.display = 'none'; $('done').style.display = 'block'; $('done').textContent = 'No screenshot changes since the last approval.'; }
</script>
