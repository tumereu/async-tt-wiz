<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#244c46">
    <title>ATW</title>
    <!-- WEB-054: installable as an app (the manifest, icons and service worker sit at the top of the site) -->
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="ATW">
    <style>
        /* No pull-to-refresh or long-press callouts over the app (WEB-011) */
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f7f8f9;
            overscroll-behavior: none; -webkit-touch-callout: none; }
        /* WEB-011: on the table and the draft the app takes every touch (pan, pinch, hold, double tap): no browser
           scrolling, zoom or text selection there (the web shell sets the class; its listeners take zoom and menus) */
        html.atw-table, html.atw-table body, html.atw-table canvas { touch-action: none; -webkit-user-select: none; user-select: none;
            -webkit-tap-highlight-color: transparent; }
        html.atw-table input, html.atw-table textarea { -webkit-user-select: text; user-select: text; }
        /* WEB-005: the first load's loading screen, until the app draws (later visits load from the browser's cache) */
        #atw-loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 16px; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #244c46; background: #f7f8f9;
            text-align: center; padding: 24px; box-sizing: border-box; z-index: 10; }
        #atw-loading h1 { margin: 0; font-size: 22px; letter-spacing: 3px; }
        #atw-loading p { margin: 0; color: #6b7788; font-size: 15px; }
        #atw-loading .bar { width: 200px; height: 4px; border-radius: 2px; background: #dde3e8; overflow: hidden; }
        #atw-loading .bar::after { content: ""; display: block; width: 40%; height: 100%; background: #107e7a; border-radius: 2px;
            animation: atw-slide 1.2s ease-in-out infinite; }
        @keyframes atw-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
        @media (prefers-reduced-motion: reduce) { #atw-loading .bar::after { animation: none; width: 100%; } }
    </style>
    <script>
        // The server replaces these with the build's folder and name (webApp's webDist); a development server leaves them.
        globalThis.atwBase = '%ATW_BASE%'.charAt(0) === '%' ? '/' : '%ATW_BASE%';
        globalThis.atwBuild = '%ATW_BUILD%'.charAt(0) === '%' ? '' : '%ATW_BUILD%';
        // WEB-056: a failure before the app runs (its code can't load, compile or start) is kept for the next visit's app
        // log, and so its problem reports (the app reads and removes it as it starts, and sets atwStarted)
        globalThis.atwStartFailed = function (text) {
            if (globalThis.atwStarted) return;
            try {
                localStorage.setItem('atw.start-failure', new Date().toISOString() + ' (build ' + (globalThis.atwBuild || 'unknown') +
                    '; ' + navigator.userAgent + '): ' + String(text).slice(0, 2000));
            } catch (e) {}
        };
        window.addEventListener('error', function (event) {
            globalThis.atwStartFailed((event.error && event.error.stack) ? event.error.stack : event.message);
        });
        window.addEventListener('unhandledrejection', function (event) {
            globalThis.atwStartFailed((event.reason && event.reason.stack) ? event.reason.stack : event.reason);
        });
        // WEB-054: the browser's install prompt, kept for Settings -> Install app (the site never shows it by itself)
        globalThis.atwInstallPrompt = null;
        window.addEventListener('beforeinstallprompt', function (event) {
            event.preventDefault();
            globalThis.atwInstallPrompt = event;
            window.dispatchEvent(new Event('atw-install'));
        });
        window.addEventListener('appinstalled', function () {
            globalThis.atwInstallPrompt = null;
            globalThis.atwInstalled = true;
            window.dispatchEvent(new Event('atw-install'));
        });
        // WEB-052, WEB-054: the service worker, for notifications and installing (it caches nothing)
        if ('serviceWorker' in navigator && window.isSecureContext && globalThis.atwBuild !== '') {
            navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function (e) { console.warn('ATW service worker: ' + e); });
        }
    </script>
</head>
<body>
<div id="atw-loading" role="status">
    <svg width="96" height="80" viewBox="0 0 96 80" aria-hidden="true">
        <path fill="#244C46" d="M24,58 C14,58 8,61 5,64 C0,69 8,73 20,75 C43,80 73,77 88,71 C95,68 94,65 88,62 C84,60 79,59 73,58 Z"/>
        <path fill="#365F53" d="M23,61 C29,46 30,30 40,18 C48,8 60,7 74,12 C62,12 55,18 57,25 C60,35 66,44 74,61 C58,68 39,68 23,61 Z"/>
        <path fill="#244C46" d="M74,12 C62,12 55,18 57,25 C60,35 66,44 74,61 L61,63 C59,46 47,32 51,23 C54,17 63,13 74,12 Z"/>
        <path fill="#D7BB6D" d="M27,50 C40,55 55,56 68,50 L73,60 C58,67 39,67 23,61 Z"/>
        <path fill="#EAD99D" d="M43,27 L46,34 L53,37 L46,40 L43,47 L40,40 L33,37 L40,34 Z"/>
        <path fill="#365F53" d="M8,65 C26,72 65,75 88,64 C79,73 49,79 20,73 C11,71 7,68 8,65 Z"/>
    </svg>
    <h1>ATW</h1>
    <p id="atw-loading-text">Loading Async Tabletop Wizards…</p>
    <div class="bar"></div>
    <noscript><p>ATW needs JavaScript turned on.</p></noscript>
</div>
<script>
    (function () {
        // WEB-005: a built-in file that fails to load is tried again a couple of times (after 1 s, then 3 s) before
        // "ATW couldn't load" shows
        var retries = [1000, 3000];
        function couldNotLoad(what) {
            globalThis.atwStartFailed(what);
            var text = document.getElementById('atw-loading-text');
            if (text) text.textContent = "ATW couldn't load. Check your connection and reload the page.";
        }
        // The app's code is built-in files too: the starting script fetches its WebAssembly modules (the app's and the drawing
        // library's), and one that didn't come stopped the app on its loading screen with nothing said (WebFileRetryTest in
        // the full run of 2026-11-23: a connection reset)
        var plainFetch = globalThis.fetch.bind(globalThis);
        globalThis.fetch = function (input, init) {
            var url = typeof input === 'string' ? input : (input && input.url) || String(input);
            if (!/\.wasm$/.test(url.split(/[?#]/)[0])) return plainFetch(input, init);
            function attempt(index) {
                function again(why) {
                    if (index >= retries.length) {
                        console.warn('ATW: ' + url + " didn't load after " + (index + 1) + ' tries: ' + why);
                        couldNotLoad(url + " couldn't be loaded after " + (index + 1) + ' tries: ' + why);
                        return null;
                    }
                    console.warn('ATW: ' + url + " didn't load (try " + (index + 1) + ' of ' + (retries.length + 1) + '): ' + why +
                        ': trying again in ' + retries[index] + ' ms');
                    return new Promise(function (resolve) { setTimeout(resolve, retries[index]); })
                        .then(function () { return attempt(index + 1); });
                }
                return plainFetch(input, init).then(function (response) {
                    if (response.ok) {
                        if (index > 0) console.info('ATW: ' + url + ' loaded at try ' + (index + 1));
                        return response;
                    }
                    return again('HTTP ' + response.status) || response;
                }, function (failure) {
                    var next = again(String(failure));
                    if (next) return next;
                    throw failure;
                });
            }
            return attempt(0);
        };
        function load(attempt) {
            var script = document.createElement('script');
            script.src = globalThis.atwBase + 'atw.js';
            script.onerror = function () {
                script.remove();
                if (attempt < retries.length) {
                    console.warn('ATW: ' + script.src + " didn't load (try " + (attempt + 1) + ' of ' + (retries.length + 1) +
                        '): trying again in ' + retries[attempt] + ' ms');
                    setTimeout(function () { load(attempt + 1); }, retries[attempt]);
                    return;
                }
                couldNotLoad(script.src + " couldn't be loaded after " + (attempt + 1) + ' tries');
            };
            if (attempt > 0) script.onload = function () { console.info('ATW: ' + script.src + ' loaded at try ' + (attempt + 1)); };
            document.body.appendChild(script);
        }
        load(0);
        // Browsers without WebAssembly garbage collection can't run the app
        if (typeof WebAssembly !== 'object' || typeof WebAssembly.validate !== 'function') {
            document.getElementById('atw-loading-text').textContent = 'This browser is too old for ATW. Update it and reload.';
        }
    })();
</script>
</body>
</html>
